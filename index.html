  function exerciseModal(id='',index=-1){const current=(day(selectedDate).exercises||[]).find(x=>x.id===id)||{},sample=index>=0?ACTIVITIES[index]:{},x={...sample,...current};modal(id?'编辑运动记录':'记录一次运动',`<p class="modal-intro">不论强度大小，只要是适合自己的活动，都值得记录。</p><form id="exerciseForm"><div class="form-grid"><div class="field full"><label for="exerciseName">运动项目 *</label><input id="exerciseName" name="name" maxlength="60" placeholder="例如：跑步 / 快走 / 力量训练" value="${esc(x.name||'')}" required></div><div class="field"><label for="exerciseMinutes">时长（分钟） *</label><input id="exerciseMinutes" name="minutes" type="number" min="1" max="1440" step="1" value="${x.minutes||''}" required></div><div class="field"><label for="exerciseIntensity">运动强度</label><select id="exerciseIntensity" name="intensity">${[['light','低强度'],['moderate','中等强度'],['vigorous','较高强度']].map(([k,l])=>`<option value="${k}" ${x.intensity===k?'selected':''}>${l}</option>`).join('')}</select></div><div class="field full"><label for="exerciseCalories">运动消耗 kcal（选填）</label><input id="exerciseCalories" name="calories" type="number" min="0" max="5000" step="1" placeholder="若有手表数据，可手动录入" value="${x.calories??''}"><small>不会自动根据项目和时长估算，避免虚假精度。</small></div><div class="field full"><label for="exerciseNote">备注</label><textarea id="exerciseNote" name="note" maxlength="300" placeholder="强度、身体感受、心率等…">${esc(x.note||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-subtle" data-action="close-modal">取消</button><button type="submit" class="btn btn-primary">${svg('check')} 保存运动</button></div></form>`,'exercise',id);}
  function sleepModal(){const sl=day(selectedDate).sleep||{};modal(sl.hours?'编辑昨夜睡眠':'记录昨夜睡眠',`<p class="modal-intro">请按醒来当天填写：例如晚上 23:30 入睡、次日 07:00 起床，填写 23:30 和 07:00，系统会自动计算跨夜时长。</p><form id="sleepForm"><div class="form-grid"><div class="field"><label for="bedtime">入睡时间 *</label><input type="time" id="bedtime" name="bedtime" value="${esc(sl.bedtime||'23:00')}" required></div><div class="field"><label for="waketime">醒来时间 *</label><input type="time" id="waketime" name="waketime" value="${esc(sl.waketime||'07:00')}" required></div><div class="field full"><label for="sleepQuality">主观睡眠质量</label><select id="sleepQuality" name="quality"><option value="great" ${sl.quality==='great'?'selected':''}>😴 很好，醒来精神不错</option><option value="good" ${sl.quality==='good'?'selected':''}>🙂 不错，睡得还可以</option><option value="okay" ${!sl.quality||sl.quality==='okay'?'selected':''}>😐 一般</option><option value="poor" ${sl.quality==='poor'?'selected':''}>😔 偏差，休息不充分</option></select></div><div class="field full"><label for="sleepNote">睡眠备注</label><textarea id="sleepNote" name="note" maxlength="300" placeholder="例如夜间醒来、咖啡因、睡前使用手机等…">${esc(sl.note||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-subtle" data-action="close-modal">取消</button><button type="submit" class="btn btn-primary">${svg('check')} 保存睡眠</button></div></form>`,'sleep');}
  function checkinModal(){const d=day(selectedDate),c=d.checkin||{};selectedMood=c.mood||'';modal('今天的身心感受',`<p class="modal-intro">这是一份私人的轻量日记。你可以只填写想记录的部分。</p><form id="checkinForm"><div class="field"><label>你今天的心情如何？</label><div class="mood-picker" style="margin-top:7px">${MOODS.map(([key,em,l])=>`<button type="button" data-action="select-mood" data-mood="${key}" class="mood-btn ${selectedMood===key?'selected':''}"><span>${em}</span><small>${l}</small></button>`).join('')}</div></div><div class="form-grid" style="margin-top:18px"><div class="field"><label for="checkinEnergy">当前活力</label><select name="energy" id="checkinEnergy"><option value="">未填写</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${String(c.energy)===String(i)?'selected':''}>${i} / 5${i===1?'（很低）':i===5?'（很足）':''}</option>`).join('')}</select></div><div class="field"><label for="checkinStress">压力感受</label><select name="stress" id="checkinStress"><option value="">未填写</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${String(c.stress)===String(i)?'selected':''}>${i} / 5${i===1?'（轻松）':i===5?'（较高）':''}</option>`).join('')}</select></div><div class="field"><label for="checkinWeight">体重（kg，选填）</label><input type="number" id="checkinWeight" name="weight" min="10" max="500" step="0.1" placeholder="例如：65.5" value="${esc(c.weight||'')}"></div><div class="field"><label for="checkinSteps">今日步数</label><input type="number" id="checkinSteps" name="steps" min="0" max="200000" step="1" value="${esc(d.steps||0)}"></div><div class="field full"><label for="checkinNotes">今天想对自己说的话</label><textarea id="checkinNotes" name="notes" maxlength="1000" placeholder="今天的状态、身体感受、疼痛或其他值得留意的事…">${esc(c.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-subtle" data-action="close-modal">取消</button><button type="submit" class="btn btn-primary">${svg('heart')} 保存今日状态</button></div></form>`,'checkin');}

  function fillFood(index){const f=FOOD_PRESETS[index];if(!f)return;[['mealName',f.name],['mealPortion',f.portion],['mealKcal',f.kcal],['mealProtein',f.p],['mealCarbs',f.c],['mealFat',f.f]].forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v;});toast('已填入估算营养值，请确认实际份量');}
  function del(list,id){if(!window.confirm('确定删除这条记录吗？此操作无法撤销。'))return;const d=ensureDay(selectedDate);d[list]=(d[list]||[]).filter(x=>String(x.id)!==String(id));save();toast('记录已删除');}
  function handleClick(e){const nav=e.target.closest('[data-view]');if(nav){switchView(nav.dataset.view);return;}

      case 'select-mood':{selectedMood=btn.dataset.mood;qa('.mood-btn').forEach(b=>b.classList.toggle('selected',b.dataset.mood===selectedMood));break;}

    }

  function handleSubmit(e){e.preventDefault();const form=e.target,data=Object.fromEntries(new FormData(form).entries()),d=ensureDay(selectedDate);
    if(form.id==='mealForm'){
      if(!String(data.name||'').trim())return toast('请填写食物名称');
      const item={id:editingId||uid(),type:MEALS.some(x=>x[0]===data.type)?data.type:'snack',name:String(data.name).trim().slice(0,70),portion:String(data.portion||'').slice(0,40),kcal:clamp(num(data.kcal),0,5000),protein:clamp(num(data.protein),0,500),carbs:clamp(num(data.carbs),0,500),fat:clamp(num(data.fat),0,500),note:String(data.note||'').slice(0,300)};
      if(!Array.isArray(d.meals))d.meals=[];
      const idx=d.meals.findIndex(x=>x.id===editingId);if(idx>=0)d.meals[idx]=item;else d.meals.push(item);
      closeModal();save();toast('饮食记录已保存');
    }else if(form.id==='exerciseForm'){
      if(!String(data.name||'').trim()||num(data.minutes)<1)return toast('请填写运动项目和时长');
      const item={id:editingId||uid(),name:String(data.name).trim().slice(0,60),minutes:clamp(num(data.minutes),1,1440),intensity:data.intensity,calories:data.calories===''?'':clamp(num(data.calories),0,5000),note:String(data.note||'').slice(0,300)};
      if(!Array.isArray(d.exercises))d.exercises=[];
      const idx=d.exercises.findIndex(x=>x.id===editingId);if(idx>=0)d.exercises[idx]=item;else d.exercises.push(item);
      closeModal();save();toast('运动记录已保存');
    }else if(form.id==='sleepForm'){
      const [bh,bm]=String(data.bedtime).split(':').map(Number),[wh,wm]=String(data.waketime).split(':').map(Number);
      let duration=(wh*60+wm)-(bh*60+bm);if(duration<=0)duration+=1440;
      if(duration<30||duration>1080)return toast('睡眠时长应在 0.5～18 小时，请检查起止时间');
      d.sleep={bedtime:data.bedtime,waketime:data.waketime,hours:round(duration/60,2),quality:data.quality,note:String(data.note||'').slice(0,300)};
      closeModal();save();toast('睡眠记录已保存');
    }else if(form.id==='checkinForm'){
      d.checkin={mood:MOODS.some(x=>x[0]===selectedMood)?selectedMood:'',energy:data.energy||'',stress:data.stress||'',weight:data.weight?String(clamp(num(data.weight),10,500)):'',notes:String(data.notes||'').slice(0,1000)};
      d.steps=clamp(num(data.steps),0,200000);closeModal();save();toast('身心记录已保存');
    }else if(form.id==='stepsForm'){
      d.steps=clamp(num(data.steps),0,200000);closeModal();save();toast('步数已更新');
    }else if(form.id==='waterForm'){
      d.water=clamp(num(data.water),0,15000);closeModal();save();toast('饮水量已更新');
    }else if(form.id==='settingsForm'){
      const values={...state.profile};values.name=String(data.name||'').trim().slice(0,25);values.goal=['balance','fitness','weight','sleep'].includes(data.goal)?data.goal:'balance';
      for(const [key,lo,hi] of [['calories',1000,6000],['protein',20,400],['carbs',20,800],['fat',10,250],['water',300,5000],['steps',500,30000],['sleep',4,12],['weeklyExercise',30,900]]){const v=Number(data[key]);if(!Number.isFinite(v)||v<lo||v>hi)return toast('请检查目标数值：'+key);values[key]=v;}
      state.profile=values;save();toast('个人目标已保存');
    }
  }
  function download(content,mime,filename){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
  function exportJSON(){const snapshot={...state,exportedAt:new Date().toISOString(),application:'栖养 Wellnest'};download(JSON.stringify(snapshot,null,2),'application/json;charset=utf-8',`栖养_健康记录备份_${today()}.json`);toast('备份文件已生成，请妥善保管');}
  function csvField(v){return `"${String(v??'').replace(/"/g,'""')}"`;}
  function exportCSV(){const rows=[['日期','食物热量(kcal)','蛋白质(g)','碳水(g)','脂肪(g)','饮水(ml)','步数','运动(分钟)','运动手动热量(kcal)','睡眠(小时)','睡眠质量','心情','活力(1-5)','压力(1-5)','体重(kg)','备注']];for(const s of weekDates()){const d=day(s),t=totals(d),c=d.checkin||{};rows.push([s,d.meals?.length?round(t.kcal,1):'',d.meals?.length?round(t.protein,1):'',d.meals?.length?round(t.carbs,1):'',d.meals?.length?round(t.fat,1):'',d.water||'',d.steps||'',d.exercises?.length?exerciseMinutes(d):'',d.exercises?.length?d.exercises.reduce((a,e)=>a+num(e.calories),0):'',d.sleep?round(sleepHours(d),2):'',d.sleep?qualityLabel(d.sleep.quality):'',MOODS.find(m=>m[0]===c.mood)?.[2]||'',c.energy||'',c.stress||'',c.weight||'',c.notes||'']);}download('\uFEFF'+rows.map(r=>r.map(csvField).join(',')).join('\r\n'),'text/csv;charset=utf-8',`栖养_7天健康周报_${selectedDate}.csv`);toast('7 天周报 CSV 已生成');}
  function sanitizeImport(raw){if(!safeRecord(raw)||!safeRecord(raw.days)||Object.keys(raw.days).length>3650)throw Error('备份格式不正确或数据量过大');const n=init(),pro=safeRecord(raw.profile)?raw.profile:{};
    n.profile.name=String(pro.name||'').slice(0,25);n.profile.goal=['balance','fitness','weight','sleep'].includes(pro.goal)?pro.goal:'balance';
    for(const [key,min,max] of [['calories',1000,6000],['protein',20,400],['carbs',20,800],['fat',10,250],['water',300,5000],['steps',500,30000],['sleep',4,12],['weeklyExercise',30,900]]){const v=Number(pro[key]);if(Number.isFinite(v)&&v>=min&&v<=max)n.profile[key]=v;}
    n.theme=raw.theme==='dark'?'dark':'light';n.demo=raw.demo===true;
    for(const [s,item] of Object.entries(raw.days)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number.isNaN(toDate(s).getTime())||!safeRecord(item))continue;
      const d=DEFAULT_DAY();d.water=clamp(num(item.water),0,15000);d.steps=clamp(num(item.steps),0,200000);
      if(Array.isArray(item.meals))d.meals=item.meals.slice(0,500).filter(safeRecord).map(m=>({id:String(m.id||uid()).slice(0,80),type:MEALS.some(x=>x[0]===m.type)?m.type:'snack',name:String(m.name||'食物').slice(0,70),portion:String(m.portion||'').slice(0,40),kcal:clamp(num(m.kcal),0,5000),protein:clamp(num(m.protein),0,500),carbs:clamp(num(m.carbs),0,500),fat:clamp(num(m.fat),0,500),note:String(m.note||'').slice(0,300)}));
      if(Array.isArray(item.exercises))d.exercises=item.exercises.slice(0,500).filter(safeRecord).map(a=>({id:String(a.id||uid()).slice(0,80),name:String(a.name||'运动').slice(0,60),minutes:clamp(num(a.minutes),0,1440),intensity:['light','moderate','vigorous'].includes(a.intensity)?a.intensity:'moderate',calories:a.calories===''?'':clamp(num(a.calories),0,5000),note:String(a.note||'').slice(0,300)}));
      if(safeRecord(item.sleep)&&/^\d{2}:\d{2}$/.test(item.sleep.bedtime||'')&&/^\d{2}:\d{2}$/.test(item.sleep.waketime||'')){let sh=clamp(num(item.sleep.hours),0,18);d.sleep={bedtime:item.sleep.bedtime,waketime:item.sleep.waketime,hours:sh,quality:['great','good','okay','poor'].includes(item.sleep.quality)?item.sleep.quality:'okay',note:String(item.sleep.note||'').slice(0,300)};}
      if(safeRecord(item.checkin)){const c=item.checkin;d.checkin={mood:MOODS.some(m=>m[0]===c.mood)?c.mood:'',energy:clamp(num(c.energy),0,5)||'',stress:clamp(num(c.stress),0,5)||'',weight:c.weight?String(clamp(num(c.weight),10,500)):'',notes:String(c.notes||'').slice(0,1000)};}
      n.days[s]=d;
    }return n;
  }
  async function importBackup(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('文件超过 12 MB');const raw=JSON.parse(await file.text()),parsed=sanitizeImport(raw);if(!window.confirm('导入备份会覆盖本设备当前的全部记录。确定继续吗？'))return;state=parsed;closeModal();save();toast('备份已导入，记录已恢复');}catch(e){toast('导入失败：'+e.message);}finally{q('#importFile').value='';}}

  q('#dateInput').addEventListener('change',e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){selectedDate=e.target.value;render();}});
  q('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!q('#modalBackdrop').hidden)closeModal();});
  q('#importFile').addEventListener('change',e=>importBackup(e.target.files[0]));
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  render();
})();

  </script>
</body>
</html>
